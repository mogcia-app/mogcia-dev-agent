substitutions:
  _SERVICE_NAME: mogcia-dev-agent-worker
  _REGION: asia-northeast1
  _FIREBASE_API_KEY: AIzaSyCeahbam39ptFljVeLhmXlK-cXZXZtzJfs
  _FIREBASE_AUTH_DOMAIN: mogcia-dev-agent.firebaseapp.com
  _FIREBASE_PROJECT_ID: mogcia-dev-agent
  _FIREBASE_STORAGE_BUCKET: mogcia-dev-agent.firebasestorage.app
  _FIREBASE_MESSAGING_SENDER_ID: "669455749480"
  _FIREBASE_APP_ID: 1:669455749480:web:fe7de96f32dcb7bb0406dd
  _FIREBASE_MEASUREMENT_ID: G-9PXJ1XQ5CM
  _ANTHROPIC_MODEL: claude-haiku-4-5
  _OPENAI_MODEL: gpt-5.6-luna

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/cloud-run/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/mogcia/${_SERVICE_NAME}:$BUILD_ID
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_FIREBASE_MEASUREMENT_ID}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/mogcia/${_SERVICE_NAME}:$BUILD_ID
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/mogcia/${_SERVICE_NAME}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --port=8080
      - --set-env-vars=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY},NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN},NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET},NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID},NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID},NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_FIREBASE_MEASUREMENT_ID},ANTHROPIC_MODEL=${_ANTHROPIC_MODEL},OPENAI_MODEL=${_OPENAI_MODEL}
      - --set-secrets=ANTHROPIC_API_KEY=anthropic-api-key:latest,OPENAI_API_KEY=openai-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/mogcia/${_SERVICE_NAME}:$BUILD_ID
