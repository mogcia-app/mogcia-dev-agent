<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOGCIA Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="widget">
      <header class="titlebar">
        <div class="drag-zone">
          <img class="robot" src="./m-dev-agent.png" alt="" />
          <div>
            <p class="eyebrow">MOGCIA</p>
            <h1>Desktop Memo</h1>
          </div>
        </div>
        <div class="window-actions">
          <button id="pinButton" title="常に前面">□</button>
          <button id="minimizeButton" title="最小化">-</button>
          <button id="closeButton" title="終了">x</button>
        </div>
      </header>

      <section id="setupPanel" class="panel hidden">
        <h2>デスクトップ連携</h2>
        <p class="sub">/settings/desktop で発行したトークンを登録してください。</p>
        <label>
          MOGCIA URL
          <input id="baseUrlInput" placeholder="http://localhost:3000" />
        </label>
        <label>
          アクセストークン
          <input id="tokenInput" placeholder="mda_..." type="password" />
        </label>
        <label class="toggle-row">
          <span>
            Macログイン時に起動
            <small>デスクトップに常設したい場合にオン</small>
          </span>
          <input id="launchAtLoginInput" type="checkbox" />
        </label>
        <button id="saveSettingsButton" class="primary">保存して接続</button>
        <div class="button-row compact">
          <button id="openSettingsButton">トークン発行画面</button>
          <button id="clearTokenButton">トークン削除</button>
        </div>
      </section>

      <section class="panel memo-panel">
        <div class="section-header">
          <h2>メモ</h2>
          <div class="mini-actions">
            <button id="openHomeButton">Home</button>
            <button id="showSetupButton">設定</button>
          </div>
        </div>
        <input id="companyInput" placeholder="会社名で検索" />
        <p id="selectedCompany" class="selected-company"></p>
        <textarea id="memoInput" placeholder="電話・打ち合わせ・気づきをここに貼り付け"></textarea>
        <div id="aiPreview" class="preview hidden"></div>
        <div class="button-row">
          <button id="parseButton">AIで整理</button>
          <button id="commitButton" class="primary" disabled>登録</button>
        </div>
      </section>

      <p id="statusText" class="status"></p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
